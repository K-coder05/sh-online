# Self-hosted game server: the app (frontend + backend) and a Postgres
# database that keeps lobbies alive across restarts. See SELF_HOSTING.md.
#   docker compose -f docker-compose.selfhost.yml up -d --build
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: secret
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: secrethitler
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secret -d secrethitler"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://secret:${POSTGRES_PASSWORD:-secret}@db:5432/secrethitler
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GAME_PORT:-8080}:8080"

volumes:
  db-data: {}
